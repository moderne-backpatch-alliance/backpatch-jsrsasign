  note: "upstream's mocha tests (npm/test/*.js, one file per run) and QUnit pages (test/qunit-do-*.html, run under Node by the lane's QUnit runner) against the packed package installed into a consumer, tests the harness fails at the tag on npmjs 10.9.0 too recorded as skipped at the tested commit: 876 tests, 821 passed, 0 failed, 55 skipped (55 skipped include the tests the harness fails at the tag on npmjs 10.9.0 too).. The CVE tests (npm/test/t_bigint_modinverse.js test/qunit-do-crypto.html), with this release's production lines reverted at the tested commit: 2 tests, 0 passed, 2 failed, 0 skipped; with them: 6 tests, 6 passed, 0 failed, 0 skipped. Built with YUI Compressor 2.4.8 (each changed source's min is the tag's min plus the change YUI makes), the root bundles spliced, make -C npm aaa, npm pack --ignore-scripts of npm/ in a directory named jsrsasign, 9 of npmjs's 13 files for 10.9.0 are identical; the rest are lib/jsrsasign-all-min.js, lib/jsrsasign-rsa-min.js, lib/jsrsasign.js, package.json. The archive's file-origins.yaml maps each packaged file to the commit, or names its inputs and build. CVE-2026-4598 is claimed here with CVE-2026-4602, since 4602's port carries 4598's modInverse fix as its prerequisite commit, and 4598's own commit follows it. Its test case getPEM private RSA z1.prv.p5p.pem > PKCS8PRV encrypted is a shared flake: 8 of 1000 interleaved runs fail on this line's package and 8 of 1000 on npmjs 10.9.0 (two-proportion z-test, p = 1.00). The package keeps npmjs's file list: test/t_bigint_modinverse.js, which this line's fixes add, is left out of it; it is at the tested commit and its results are in the report."
