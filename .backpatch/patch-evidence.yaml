    note: "Carried from 10.9.1-backpatch-00001; upstream's fix in 11.1.1 (5ea1c32, 4407d2c, ebf11a1). It closes the advisory: jsrsasign: Negative Exponent Handling Leads to Signature Verification Bypass."
  - cve: CVE-2026-4598
    upstream_fix_url: https://github.com/kjur/jsrsasign/commit/ca5b027240287a1e71fe63019fc4400332594323
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-4598
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-jsrsasign/compare/99f3dbb~1...1cfd099
    basis: backport
    artifacts:
