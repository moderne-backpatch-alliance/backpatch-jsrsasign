    note: "Carried from 10.9.1-backpatch-00001; upstream's fix in 11.1.1 (ca5b027, 2af4cb4). It closes the advisory: jsrsasign is vulnerable to DoS through Infinite Loop when processing zero or negative inputs."
  - cve: CVE-2026-4603
    upstream_fix_url: https://github.com/kjur/jsrsasign/commit/d1e331fff0ed753639b82a878b1d38dc206ed397
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-4603
