  report_sha256: 3118e7ab0b8bed2ea3c25a9530757d92517a80f4a2853718ee02f2af29d296d2
  result: pass
  note: "upstream's mocha tests (npm/test/*.js, one file per run) and QUnit pages (test/qunit-do-*.html, run under Node by the lane's QUnit runner) against the packed package installed into a consumer, tests the harness fails at the tag on npmjs 10.9.0 too recorded as skipped at the tested commit: 885 tests, 833 passed, 0 failed, 52 skipped (52 skipped include the tests the harness fails at the tag on npmjs 10.9.0 too).. The CVE tests (npm/test/t_crypto_randbigint.js test/qunit-do-crypto.html), with this release's production lines reverted at the tested commit: 4 tests, 0 passed, 4 failed, 0 skipped; with them: 4 tests, 4 passed, 0 failed, 0 skipped. Built with YUI Compressor 2.4.8 (each changed source's min is the tag's min plus the change YUI makes), the root bundles spliced, make -C npm aaa, npm pack --ignore-scripts of npm/ in a directory named jsrsasign, 7 of npmjs's 13 files for 10.9.0 are identical; the rest are lib/footer.js, lib/jsrsasign-all-min.js, lib/jsrsasign-jwths-min.js, lib/jsrsasign-rsa-min.js, lib/jsrsasign.js, package.json. The archive's file-origins.yaml maps each packaged file to the commit, or names its inputs and build. The suite's qunit-do-dsa.html 'signWithMessageHash test1' is the known random-k DER flake: in reruns it failed 5 of 200 on npmjs 10.9.0 and 6 of 200 on this line's package; a suite run failing only it is rerun. The package keeps npmjs's file list: test/t_bigint_modinverse.js, test/t_crypto_randbigint.js, test/t_keyutil_getpem.js, test/t_rsa_noencrypt.js, which this line's fixes add, are left out of it; they are at the tested commit and their results are in the report."
