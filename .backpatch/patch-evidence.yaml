  note: "upstream's mocha tests (npm/test/*.js, one file per run) and QUnit pages (test/qunit-do-*.html, run under Node by the lane's QUnit runner) against the packed package installed into a consumer, tests the harness fails at the tag on npmjs 10.9.0 too recorded as skipped at the tested commit: 882 tests, 827 passed, 0 failed, 55 skipped (55 skipped include the tests the harness fails at the tag on npmjs 10.9.0 too).. The CVE tests (test/qunit-do-dsa.html), with this release's production lines reverted at the tested commit: 1 tests, 0 passed, 1 failed, 0 skipped; with them: 1 tests, 1 passed, 0 failed, 0 skipped. Built with YUI Compressor 2.4.8 (each changed source's min is the tag's min plus the change YUI makes), the root bundles spliced, make -C npm aaa, npm pack --ignore-scripts of npm/ in a directory named jsrsasign, 8 of npmjs's 13 files for 10.9.0 are identical; the rest are lib/jsrsasign-all-min.js, lib/jsrsasign-jwths-min.js, lib/jsrsasign-rsa-min.js, lib/jsrsasign.js, package.json. The archive's file-origins.yaml maps each packaged file to the commit, or names its inputs and build. The suite's random-key flakes fail on npmjs 10.9.0 too: qunit-do-dsa.html 'signWithMessageHash test1' (a random DSA k gives an r or s under 20 bytes and changes the DER heading) in 5 of 200 and 8 of 200 runs of the verify's reruns, and qunit-do-keyutil-p8egen.html 'getEncryptedPKCS8Hex' (random salt and IV) in 10 of 200 page runs there and 6 of 200 on this line's package; a suite run failing only these is rerun, as the suite result says when it happens. The package keeps npmjs's file list: test/t_bigint_modinverse.js, which this line's fixes add, is left out of it; it is at the tested commit and its results are in the report."
