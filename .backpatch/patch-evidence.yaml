    note: "Carried from 10.9.1-backpatch-00002; upstream's fix in 11.1.1 (d1e331f, dc41d49). It closes the advisory: jsrsasign: Division by Zero Allows Invalid JWK Modulus to Cause Deterministic Zero Output in RSA Operations."
  - cve: CVE-2026-4600
    upstream_fix_url: https://github.com/kjur/jsrsasign/commit/ced537bbab9328ce412d6884a693da09498d1653
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-4600
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-jsrsasign/compare/12e79de~1...c45d43d
    basis: backport
    artifacts:
      - jsrsasign
    note: "Carried from 10.9.1-backpatch-00003; upstream's fix in 11.1.1 (ced537b, 37b4c06). It closes the advisory: jsrsasign: DSA signatures or X.509 certificates can be forged via DSA domain-parameter validation in KJUR.crypto.DSA.setPublic."
  - cve: CVE-2026-4601
    upstream_fix_url: https://github.com/kjur/jsrsasign/commit/abe0f95a36eb4e4e9aacb8a7a9cf96709fe8281f
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-4601
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-jsrsasign/compare/57d3f29~1...9bec95d
    basis: backport
    artifacts:
      - jsrsasign
    note: "Carried from 10.9.1-backpatch-00004; upstream's fix in 11.1.1 (abe0f95, 0710e39). It closes the advisory: jsrsasign: Missing cryptographic validation during DSA signing enables private key extraction."
  - cve: CVE-2024-21484
    upstream_fix_url: https://github.com/kjur/jsrsasign/commit/d73befc129a1a344fa7dc3f672a9b813528fb197
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2024-21484
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-jsrsasign/compare/51562fd~1...75b0c41
    basis: adapted
    artifacts:
      - jsrsasign
    note: "New in this release; upstream's fix in 11.0.0 (d73befc, 58bb241), adapted to 10.9.0. It closes the advisory: Marvin Attack of RSA and RSAOAEP decryption in jsrsasign. RSA and RSA-OAEP encryption and decryption are removed, as upstream's 11.0.0 removed them: RSAKey.prototype.encrypt, encryptOAEP, decrypt and decryptOAEP are gone, KJUR.crypto.Cipher.encrypt and decrypt throw Cipher.encrypt: unsupported key or algorithm for RSA keys, KJUR.crypto.Cipher.getAlgByKeyAndName is gone, and the npm entry point no longer exports Cipher, so require('jsrsasign').Cipher is undefined. An application that encrypts or decrypts with RSA through jsrsasign on this line breaks. KJUR.crypto.Cipher with AES or DES-EDE3-CBC, and encrypted PKCS#8 keys, still work."
